# Render Blueprint for Mazeed Campaign Orchestrator
# Put this file at the root of the repo Codex builds, then in Render:
# New → Blueprint → pick the repo. Render creates everything below and links them.

projects:
  - name: mazeed-campaign-orchestrator
    environments:
      - name: production
        services:
          # Web: HTTP API, Bitrix install/OAuth handlers, React UI
          - type: web
            name: co-web
            runtime: node
            region: frankfurt
            plan: starter
            buildCommand: npm ci && npx prisma generate && npm run build
            preDeployCommand: npx prisma migrate deploy
            startCommand: node dist/apps/api/main.js
            healthCheckPath: /health
            envVars:
              - fromGroup: co-shared
              - key: DATABASE_URL
                fromDatabase:
                  name: co-db
                  property: connectionString
              - key: PROCESS_ROLE
                value: web

          # Worker: scheduler tick + campaign runner (pg-boss)
          - type: worker
            name: co-worker
            runtime: node
            region: frankfurt
            plan: starter
            buildCommand: npm ci && npx prisma generate && npm run build
            startCommand: node dist/apps/worker/main.js
            envVars:
              - fromGroup: co-shared
              - key: DATABASE_URL
                fromDatabase:
                  name: co-db
                  property: connectionString
              - key: PROCESS_ROLE
                value: worker

        databases:
          - name: co-db
            databaseName: campaign_orchestrator
            user: co_app
            region: frankfurt
            plan: basic-256mb
            postgresMajorVersion: "16"
            ipAllowList: []   # only Render services can connect

envVarGroups:
  - name: co-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Dubai
      - key: APP_BASE_URL
        value: https://campaigns.mazeed.com   # change if you use the onrender.com URL
      - key: BITRIX_PORTAL
        value: mazeed.bitrix24.ae
      - key: BITRIX_RATE_PER_SEC
        value: "2"
      - key: BITRIX_RATE_SAFETY
        value: "0.8"
      - key: RETRY_WAIT_MS
        value: "2000"
      - key: RETRY_MAX
        value: "3"
      - key: SYSTEM_HOURS
        value: "Sun-Thu 08:00-20:00"
      # Secrets: Render asks for these values during Blueprint setup. Never commit them.
      - key: BITRIX_CLIENT_ID
        sync: false
      - key: BITRIX_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
